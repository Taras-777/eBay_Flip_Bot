# Перевірка типів у CI (GitHub Actions → type-check).
# Код без анотацій, тож режим м'який: ловить явні помилки (не той тип,
# неіснуючий атрибут, помилка у виклику), а не вимагає анотацій скрізь.
[mypy]
python_version = 3.12
ignore_missing_imports = True
follow_imports = silent
strict_optional = False
exclude = (^tests/|^\.venv/|^venv/)
